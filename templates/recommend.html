<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Recommendation</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<script>
    function calculateScores(){
        var mathScore=parseFloat(document.getElementById("math_score").value);
        var historyScore=parseFloat(document.getElementById("history_score").value);
        var physicsScore=parseFloat(document.getElementById("physics_score").value);
        var chemistryScore=parseFloat(document.getElementById("chemistry_score").value);
        var biologyScore=parseFloat(document.getElementById("biology_score").value);
        var englishScore=parseFloat(document.getElementById("english_score").value);
        var geographyScore=parseFloat(document.getElementById("geography_score").value);
        var totalScore=mathScore+historyScore+physicsScore+chemistryScore+biologyScore+englishScore+geographyScore;
        var averageScore=totalScore/7;
        document.getElementById("total_score").value=totalScore.toFixed(2)
        document.getElementById("average_score").value=averageScore.toFixed(2)   
    }
</script>
<body style="background-image:linear-gradient(to right,#f0eb9b ,#a4f0e3);">
    <div class="container" style="background-color:rgb(175, 153, 233);border:2px solid black; text-align: center;">
        <h2>Fill The Form</h2>
    </div>
        <div class="text-container">
            <form method="post" action="/pred">
                <div class="row">
                    <div class="col-md-6"> 
                        <label for="gender"><h3>Gender</h3></label>
                        <select name="gender" id="gender" class="form-control">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="part_time_job" style=""><h3>Part Time Job</h3></label>
                            <select name="part_time_job" id="part_time_job" class="form-control">
                                <option value="yes">Yes</option>
                                <option value="no">No</option>
                            </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label for="absence_days" style=""><h3>Absence Days</h3></label>
                        <input type="number" class="form-control" id="absence_days" name="absence_days">
                    </div>
                    <div class="col-md-6" style="float:left;">
                        <label for="extracurricular_activities" style=""><h3>Extracurricular Activities</h3></label>
                            <select name="extracurricular_activities" id="extracurricular_activities" class="form-control">
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                            </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6" >
                        <label for="weekly_self_study_hours" style=""><h3>Weekly Study Hours</h3></label>
                        <input type="number" class="form-control" id="weekly_self_study_hours" name="weekly_self_study_hours">
                    </div>
                    <div class="col-md-6">
                        <label for="math_score" style=""><h3>Math Score</h3></label>
                        <input type="number" class="form-control" id="math_score" name="math_score" onchange="calculateScores()">  
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label for="history_score" style=""><h3>History Score</h3></label>
                        <input type="number" class="form-control" id="history_score" name="history_score" onchange="calculateScores()">
                    </div>
                    <div class="col-md-6">
                        <label for="physics_score" style=""><h3>Physics Score</h3></label>
                        <input type="number" class="form-control" id="physics_score" name="physics_score" onchange="calculateScores()">  
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label for="chemistry_score" style=""><h3>Chemistry Score</h3></label>
                        <input type="number" class="form-control" id="chemistry_score" name="chemistry_score" onchange="calculateScores()">
                    </div>
                    <div class="col-md-6">
                        <label for="biology_score" style=""><h3>Biology Score</h3></label>
                        <input type="number" class="form-control" id="biology_score" name="biology_score" onchange="calculateScores()">  
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label for="english_score" style=""><h3>English Score</h3></label>
                        <input type="number" class="form-control" id="english_score" name="english_score" onchange="calculateScores()">
                    </div>
                    <div class="col-md-6">
                        <label for="geography_score" style=""><h3>Geography Score</h3></label>
                        <input type="number" class="form-control" id="geography_score" name="geography_score" onchange="calculateScores()">  
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label for="total_score" style=""><h3>Total Score</h3></label>
                        <input type="number" class="form-control" id="total_score" name="total_score" readonly>
                    </div>
                    <div class="col-md-6">
                        <label for="average_score" style=""><h3>Average Score</h3></label>
                        <input type="number" step="0.000001" class="form-control" id="average_score" name="average_score" readonly>  
                    </div>
                </div>
                <div style="text-align: center;padding-inline-start: 32px;padding-top: 10px;">
                    <button type="submit" style="padding-inline:190px;background-color: rgb(175, 153, 233);"><h3>Submit</h3></button>
                </div>
            </form>
        </div>
</body>
</html>
